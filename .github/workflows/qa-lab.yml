name: Evergreen SYNTHETIC QA training (not UCSF deployment)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # UTC, Monday weekly TRAINING run

permissions:
  contents: read

jobs:
  python-fast:
    name: Synthetic policy, contract, agent, security and campaign tests
    runs-on: ubuntu-latest # only localhost lab data; never connect to UCSF resources
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and Allure adapter
        run: python -m pip install -r requirements.txt
      - name: Run fast QA tests and produce JUnit + Allure raw data
        run: |
          mkdir -p reports
          python -m pytest tests -m 'not demo_failure and not scale and not acceptance' --junitxml=reports/junit.xml --alluredir=reports/allure-results
      - name: Create evidence manifest and portable HTML summary
        if: always()
        run: python scripts/report.py
      - name: Install Java for optional rich Allure HTML
        if: always()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '22'
      - name: Generate full Allure HTML
        if: always()
        run: |
          npm install --no-save allure-commandline@2
          ./node_modules/.bin/allure generate reports/allure-results --clean -o reports/allure-report
      - name: Archive evidence on both PASS and FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-python-qa-${{ github.run_id }}
          path: reports/
          retention-days: 14 # demo only; real retention requires governance approval
          if-no-files-found: warn
      - name: Optional import into Jira test management (main only)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          QA_JIRA_PROVIDER: ${{ vars.QA_JIRA_PROVIDER }}
          QA_JIRA_PROJECT: ${{ vars.QA_JIRA_PROJECT }}
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
        run: python scripts/publish_jira.py

  ui-smoke:
    name: Synthetic browser checks (Playwright TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run UI tests
        run: |
          mkdir -p reports
          npm run test:ui
      - name: Archive screenshots, traces, Playwright HTML and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-qa-${{ github.run_id }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
