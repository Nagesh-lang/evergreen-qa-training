[pytest]
addopts = -ra
markers =
    unit: L1 unit (lab demonstration)
    contract: L2 contract (lab demonstration)
    policy: L3 policy vectors (lab demonstration)
    agent: L4 agent evaluation toy (not a real golden-set score)
    injection: L5 injection toy
    integration: L6 synthetic campaign toy (not deployed Step Functions)
    scale: L7 small algorithm exercise (NOT production load test)
    drill: L8 failure drill toy (not environment fault injection)
    security: L9 role check toy (NOT Cedar or SCP conformance)
    acceptance: L10 walkthrough toy (NOT UCSF UAT)
    demo_failure: intentionally failing training exercise; excluded normally
